services:
  iteam:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Strongly recommended: the API is reachable from the network inside a container
      ITEAM_TOKEN: ${ITEAM_TOKEN:-}
      # Optional separate credential for runners (defaults to ITEAM_TOKEN)
      ITEAM_RUNNER_TOKEN: ${ITEAM_RUNNER_TOKEN:-}
      ITEAM_MAX_PARALLEL: ${ITEAM_MAX_PARALLEL:-4}
      ITEAM_RETENTION_DAYS: ${ITEAM_RETENTION_DAYS:-0}
      # Credentials for the agent CLIs inside the container
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - iteam-data:/data
      # Mount the repositories your agents should work on
      - ./workspace:/workspace
    restart: unless-stopped

volumes:
  iteam-data:
